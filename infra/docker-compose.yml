# Local Postgres + Redis for development.
# If you don't have Docker, point DATABASE_URL / REDIS_URL at a hosted instance
# (Railway, Neon, Upstash) instead — the app only needs the connection URLs.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: intercom
      POSTGRES_PASSWORD: intercom
      POSTGRES_DB: intercom
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intercom"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
